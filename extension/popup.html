<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foldreel</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 344px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .logo { width: 28px; height: 28px; border-radius: 7px; flex: none; }
  .head h1 { flex: 1; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  main { padding: 0 16px 6px; }

  .page { margin-bottom: 12px; min-width: 0; }
  .page-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page-url { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field code { display: block; margin-top: 6px; font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; max-height: 3.2em; overflow: hidden; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }

  #pair p { color: var(--muted); margin-bottom: 10px; }
  #pair .btn { margin-top: 8px; }

  .item.slim { padding-top: 9px; padding-bottom: 9px; }
  .status { margin-top: 10px; }
  footer { display: flex; align-items: center; gap: 14px; padding: 8px 16px 14px; font-size: 12px; }
  footer .spacer { flex: 1; }
  #version { color: var(--muted); }
</style>
</head>
<body>
  <header class="head">
    <img class="logo" src="icons/icon48.png" alt="">
    <h1>Foldreel</h1>
    <span id="conn" class="pill"><span class="dot" aria-hidden="true"></span><span id="conn-text">Checking…</span></span>
  </header>

  <main>
    <form id="pair" hidden>
      <p>In Foldreel, open Advanced, then Extension, and press Link. Or paste the pairing code here.</p>
      <label class="sr" for="pair-code" style="position:absolute;left:-9999px">Pairing code</label>
      <input id="pair-code" type="text" class="mono" placeholder="Pairing code" autocomplete="off" spellcheck="false">
      <button id="pair-connect" class="btn primary block" type="submit">Connect</button>
    </form>

    <section id="send-area" hidden>
      <div class="page">
        <p id="page-title" class="page-title"></p>
        <p id="url" class="page-url"></p>
      </div>

      <div id="media-detect" class="field" hidden>
        <label for="media-use">Send</label>
        <select id="media-use">
          <option value="page" selected>This page</option>
          <option value="direct">The video file found on it</option>
        </select>
        <code id="media-url"></code>
      </div>

      <div class="row" id="yt-row" hidden>
        <select id="quality" aria-label="Video quality">
          <option value="best">Best quality</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
        </select>
        <select id="format" aria-label="Format">
          <option value="mp4">MP4</option>
          <option value="mp3">MP3 (audio)</option>
        </select>
      </div>

      <button id="send" class="btn primary block" type="button">Send to Foldreel</button>

      <h2 id="site-heading" class="group-title">This site</h2>
      <div class="list" role="group" aria-labelledby="site-heading">
        <div class="item">
          <div class="item-text">
            <span class="item-title" id="hover-title">Floating button</span>
            <span class="item-desc" id="hover-desc"></span>
          </div>
          <label class="switch">
            <input id="hover-site" type="checkbox" role="switch" aria-labelledby="hover-title" aria-describedby="hover-desc">
            <span class="track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="item">
          <div class="item-text">
            <span class="item-title" id="popups-title">Pop-up blocker</span>
            <span class="item-desc" id="popups-desc"></span>
          </div>
          <label class="switch">
            <input id="popups-site" type="checkbox" role="switch" aria-labelledby="popups-title" aria-describedby="popups-desc">
            <span class="track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="item">
          <div class="item-text">
            <span class="item-title" id="cookie-title">Login cookies</span>
            <span class="item-desc" id="cookie-desc">Checking…</span>
          </div>
          <button id="send-cookies" class="btn small" type="button" aria-describedby="cookie-desc">Add</button>
        </div>
      </div>

      <h2 id="all-heading" class="group-title">Every site</h2>
      <div class="list" role="group" aria-labelledby="all-heading">
        <div class="item slim">
          <span class="item-title" id="hover-all-title">Floating button</span>
          <label class="switch">
            <input id="hover-all" type="checkbox" role="switch" aria-labelledby="hover-all-title">
            <span class="track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="item slim">
          <span class="item-title" id="popups-all-title">Pop-up blocker</span>
          <label class="switch">
            <input id="popups-all" type="checkbox" role="switch" aria-labelledby="popups-all-title">
            <span class="track" aria-hidden="true"></span>
          </label>
        </div>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <a href="#" id="open-settings">Settings</a>
    <a href="#" id="disconnect-link" hidden>Disconnect</a>
    <span class="spacer"></span>
    <span id="version"></span>
  </footer>

  <script src="prefs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
