<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Foldreel</title>
<style>
  :root {
    --accent: #ff5c5c;
    --accent-ink: #1a1210;
    --bg: #0a0a0a;
    --surface: #131313;
    --surface-2: #171717;
    --border: #262626;
    --border-soft: #202020;
    --text: #fafafa;
    --muted: #8a8a8a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    position: relative;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 16px;
    width: 304px;
    animation: bodyIn .12s ease-out;
  }
  #version {
    position: absolute; bottom: 6px; right: 12px;
    font-size: 10px; color: #52525b; user-select: none; pointer-events: none;
  }
  @keyframes bodyIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes revealIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

  /* A slightly lighter "strip" behind the header, same layered-darkness idea
     as the app's sidebar-vs-content split, instead of one flat background. */
  .header {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border-bottom: 1px solid var(--border-soft);
    padding: 13px 18px;
  }
  .brand-badge {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-badge img { width: 15px; height: 15px; display: block; }
  h1 { font-size: 12.5px; font-weight: 600; letter-spacing: .01em; margin: 0; flex: 1; }

  .body { padding: 14px 18px 0; }

  #conn { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 999px; padding: 6px 11px; margin: 0 0 14px; width: fit-content; }
  #conn .dot { width: 6px; height: 6px; border-radius: 50%; background: #52525b; flex: none; }
  #conn.ok .dot { background: #34d399; animation: pulseDot 2s ease-in-out infinite; }
  #conn.bad .dot { background: #f87171; }
  #conn.warn .dot { background: #f59e0b; }
  @keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .45); }
    50% { box-shadow: 0 0 0 4px rgba(52, 211, 153, 0); }
  }

  p#url { font-size: 11px; font-family: "JetBrains Mono", Consolas, monospace; color: #a1a1aa; margin: 0 0 13px; word-break: break-all; line-height: 1.45; max-height: 3.6em; overflow: hidden; }

  button { font-family: inherit; cursor: pointer; transition: transform .08s ease, filter .12s ease, background-color .12s ease, border-color .12s ease; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { cursor: default; }

  select, input[type="text"] {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    padding: 7px 9px; font-size: 12px; font-family: inherit;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  select:focus, input[type="text"]:focus {
    outline: none; border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 10%, transparent);
  }

  .row { display: flex; gap: 8px; margin-bottom: 13px; animation: revealIn .16s ease-out; }
  .row[hidden] { display: none; }
  .row select { flex: 1; }

  button#send, button#pair-connect {
    width: 100%; background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; font-weight: 700; letter-spacing: .01em;
  }
  button#send:hover:not(:disabled), button#pair-connect:hover:not(:disabled) { filter: brightness(1.08); }
  button#send:disabled, button#pair-connect:disabled { opacity: .5; }

  button#send-cookies {
    width: 100%; margin-top: 8px; background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px;
    font-size: 11.5px; font-weight: 600;
  }
  button#send-cookies:hover:not(:disabled) { color: var(--text); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  button#send-cookies:disabled { opacity: .5; }

  #status { margin-top: 11px; font-size: 12px; min-height: 16px; }
  .ok { color: #34d399; }
  .bad { color: #f87171; }

  #pair { animation: revealIn .16s ease-out; }
  #pair[hidden] { display: none; }
  #pair input { width: 100%; margin-bottom: 10px; font-family: "JetBrains Mono", Consolas, monospace; }

  #send-area { animation: revealIn .16s ease-out; }
  #send-area[hidden] { display: none; }

  /* A left accent bar instead of a boxed card - the same device the app
     uses on job/queue rows to flag something as worth a second look,
     without the visual weight of a full bordered block. */
  #media-detect {
    margin: 0 0 14px; padding: 2px 0 2px 11px;
    border-left: 2px solid var(--accent);
    animation: revealIn .16s ease-out;
  }
  #media-detect[hidden] { display: none; }
  #media-detect label { display: block; font-size: 10.5px; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
  #media-detect select { width: 100%; }
  #media-detect code { display: block; font-family: "JetBrains Mono", Consolas, monospace; color: #71717a; word-break: break-all; margin-top: 7px; line-height: 1.4; }

  a#disconnect-link { display: inline-block; margin-top: 12px; font-size: 11px; color: #71717a; text-decoration: none; transition: color .12s ease; animation: revealIn .16s ease-out; }
  a#disconnect-link[hidden] { display: none; }
  a#disconnect-link:hover { color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
  <div class="header">
    <span class="brand-badge"><img src="icons/icon32.png" alt="" /></span>
    <h1>Send to Foldreel</h1>
  </div>

  <div class="body">
    <div id="conn"><span class="dot" aria-hidden="true"></span><span id="conn-text">Checking connection…</span></div>

    <div id="pair" hidden>
      <input id="pair-code" type="text" placeholder="paste code here" autocomplete="off" spellcheck="false" />
      <button id="pair-connect">Connect</button>
    </div>

    <div id="send-area" hidden>
      <p id="url">Loading…</p>
      <div id="media-detect" hidden>
        <label for="media-use">Link to send</label>
        <select id="media-use">
          <option value="page" selected>This page's link</option>
          <option value="direct">Detected direct file link</option>
        </select>
        <code id="media-url"></code>
      </div>
      <div class="row" id="yt-row" hidden>
        <select id="quality" aria-label="Video quality">
          <option value="best">Best quality</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
        </select>
        <select id="format" aria-label="Format">
          <option value="mp4">MP4</option>
          <option value="mp3">MP3 (audio)</option>
        </select>
      </div>
      <button id="send">Send to Foldreel</button>
      <button id="send-cookies" type="button">Send cookies for this site</button>
    </div>

    <div id="status"></div>
    <a href="#" id="disconnect-link" hidden>Disconnect</a>
  </div>
  <span id="version"></span>
  <script src="popup.js"></script>
</body>
</html>
